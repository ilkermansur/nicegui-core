[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ngui"
version = "1.1.0"
requires-python = ">=3.12"
dependencies = ["nicegui==4.0.0", "tomli-w>=1.0", "packaging>=24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ngui = "ngui.cli:main"

[tool.setuptools]
packages = ["ngui"]

[tool.setuptools.package-data]
ngui = ["locales/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
